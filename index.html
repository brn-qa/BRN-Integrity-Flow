<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRN Integrity Flow</title>

  <link rel="icon"
    href="https://raw.githubusercontent.com/brn-qa/logo/refs/heads/main/Rezki.png"
    type="image/x-icon">

  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #06111f;
      --cyan: #00eaff;
      --blue: #2563eb;
      --violet: #7c3aed;
      --text: #e8fbff;
      --muted: rgba(232, 251, 255, .62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-1);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: var(--bg-1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* =========================================================
       BRN MINIMAL FUTURISTIC LOADER
       Simpel, elegan, tanpa card/kotak, fokus pada logo.
    ========================================================== */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(0, 234, 255, .13), transparent 31%),
        radial-gradient(circle at 24% 24%, rgba(124, 58, 237, .15), transparent 34%),
        radial-gradient(circle at 78% 76%, rgba(37, 99, 235, .13), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, #020617);
      transition:
        opacity .55s ease,
        visibility .55s ease,
        background .65s ease;
    }

    .loader::before,
    .loader::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
    }

    .loader::before {
      background:
        linear-gradient(110deg,
          transparent 0%,
          transparent 42%,
          rgba(0, 234, 255, .10) 50%,
          transparent 58%,
          transparent 100%);
      transform: translateX(-42%) rotate(7deg);
      animation: softScan 3.4s linear infinite;
      opacity: .72;
    }

    .loader::after {
      background-image:
        linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 68%);
      opacity: .36;
    }

    @keyframes softScan {
      to {
        transform: translateX(42%) rotate(7deg);
      }
    }

    .loader-shell {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 22px;
      transform: translateY(-2px);
      transition:
        transform .9s cubic-bezier(.16, 1, .3, 1),
        opacity .65s ease,
        filter .65s ease;
      will-change: transform, opacity, filter;
    }

    .logo-stage {
      position: relative;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
    }

    .halo,
    .orbit,
    .orbit::before,
    .orbit::after {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .halo {
      inset: 9px;
      background: radial-gradient(circle, rgba(0, 234, 255, .18), transparent 63%);
      filter: blur(4px);
      animation: haloBreath 2.1s ease-in-out infinite;
    }

    .orbit {
      inset: 3px;
      border: 1px solid rgba(0, 234, 255, .18);
      box-shadow:
        0 0 22px rgba(0, 234, 255, .12),
        inset 0 0 18px rgba(0, 234, 255, .07);
      animation: orbitFloat 5.5s linear infinite;
    }

    .orbit::before {
      content: "";
      inset: 12px;
      border: 1px solid transparent;
      border-top-color: rgba(232, 251, 255, .68);
      border-right-color: rgba(0, 234, 255, .45);
      filter: drop-shadow(0 0 8px rgba(0, 234, 255, .44));
    }

    .orbit::after {
      content: "";
      inset: -3px;
      border: 1px solid transparent;
      border-left-color: rgba(124, 58, 237, .48);
      border-bottom-color: rgba(37, 99, 235, .46);
      opacity: .8;
    }

    .logo-core {
      position: relative;
      z-index: 2;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(255, 255, 255, .035);
      box-shadow:
        0 0 0 1px rgba(232, 251, 255, .16),
        0 0 24px rgba(0, 234, 255, .24),
        0 18px 55px rgba(0, 0, 0, .34);
      animation: coreBreath 1.85s ease-in-out infinite;
    }

    .logo-core img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .micro-line {
      width: min(210px, 58vw);
      height: 2px;
      border-radius: 999px;
      overflow: hidden;
      background: linear-gradient(90deg, transparent, rgba(232, 251, 255, .15), transparent);
    }

    .micro-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), transparent);
      box-shadow: 0 0 14px rgba(0, 234, 255, .58);
      transition: width .24s ease;
    }

    .micro-status {
      margin-top: -10px;
      color: var(--muted);
      font-size: .68rem;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      opacity: .88;
      transition: opacity .35s ease, transform .35s ease;
    }

    @keyframes haloBreath {
      0%, 100% {
        transform: scale(.96);
        opacity: .54;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes orbitFloat {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes coreBreath {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.035);
      }
    }

    /* EXIT: halus, futuristik, logo menyatu ke titik cahaya lalu hilang */

    .loader.is-complete .micro-line,
    .loader.is-complete .micro-status {
      opacity: 0;
      transform: translateY(8px);
    }

    .loader.is-complete .loader-shell {
      transform: scale(.92);
    }

    .loader.is-exit {
      background: transparent;
    }

    .loader.is-exit::before,
    .loader.is-exit::after {
      opacity: 0;
      animation-play-state: paused;
    }

    .loader.is-exit .loader-shell {
      transform: perspective(900px) translateZ(-620px) scale(.04);
      opacity: 0;
      filter: blur(2px);
    }

    .loader.is-exit .halo {
      animation: lightCollapse .72s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .loader.is-exit .orbit {
      animation: ringCollapse .78s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes lightCollapse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      48% {
        transform: scale(1.42);
        opacity: .42;
      }

      100% {
        transform: scale(.03);
        opacity: 0;
      }
    }

    @keyframes ringCollapse {
      0% {
        transform: rotate(0deg) scale(1);
        opacity: 1;
      }

      45% {
        transform: rotate(120deg) scale(1.28);
        opacity: .55;
      }

      100% {
        transform: rotate(260deg) scale(.02);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .logo-stage {
        width: 116px;
        height: 116px;
      }

      .logo-core {
        width: 78px;
        height: 78px;
      }

      .micro-line {
        width: min(190px, 62vw);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="iframe-container">

    <div class="loader" id="loader" aria-label="Loading BRN Integrity Flow">
      <div class="loader-shell">
        <div class="logo-stage">
          <span class="halo"></span>
          <span class="orbit"></span>
          <div class="logo-core">
            <img src="https://raw.githubusercontent.com/brn-qa/logo/refs/heads/main/Rezki.png" alt="BRN Logo">
          </div>
        </div>

        <div class="micro-line" aria-hidden="true">
          <div class="micro-fill" id="progressFill"></div>
        </div>

        <div class="micro-status" id="statusText">INITIALIZING</div>
      </div>
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbxSNF08QmQ7V3j2QTk_4val_HguuhSFRBkO60Pyewl8Ps2g7-4fkn6wsI-B-VkvzfJ51w/exec"
      title="BRN Integrity Flow"
      onload="finishLoading()"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const loader = document.getElementById("loader");
    const progressFill = document.getElementById("progressFill");
    const statusText = document.getElementById("statusText");

    let progress = 0;
    let loaded = false;

    const statusSteps = [
      { limit: 28, text: "INITIALIZING" },
      { limit: 58, text: "SECURING" },
      { limit: 86, text: "SYNCING" },
      { limit: 100, text: "READY" }
    ];

    const fakeLoading = setInterval(() => {
      if (loaded) return;

      progress += Math.floor(Math.random() * 4) + 2;
      progress = Math.min(progress, 92);
      renderProgress(progress);
    }, 220);

    function renderProgress(value) {
      progressFill.style.width = value + "%";
      const current = statusSteps.find(step => value <= step.limit);
      statusText.textContent = current ? current.text : "READY";
    }

    function finishLoading() {
      if (loaded) return;

      loaded = true;
      clearInterval(fakeLoading);
      renderProgress(100);

      setTimeout(() => loader.classList.add("is-complete"), 240);
      setTimeout(() => loader.classList.add("is-exit"), 760);
      setTimeout(() => loader.classList.add("is-hidden"), 1480);
    }

    // Pengaman agar loader tidak menggantung jika iframe sangat lambat atau onload tidak terpanggil.
    setTimeout(() => {
      if (!loaded) finishLoading();
    }, 12000);
  </script>
</body>

</html>
